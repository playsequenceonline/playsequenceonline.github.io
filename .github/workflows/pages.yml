# Publishes the site to GitHub Pages: every file in the repo except build-only files.
name: Publish game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder
        run: |
          mkdir -p _site
          if [ -f chipline-site.zip ]; then unzip -o chipline-site.zip -d _site; fi
          tar --exclude='./.git' --exclude='./.github' --exclude='./_site' --exclude='./chipline-site.zip' -cf - . | tar -xf - -C _site
          touch _site/.nojekyll
          ls -laR _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
